        plainTalk: [

            title: "🔦 四大线性模型：感知器 vs 最小二乘(MSE) vs Fisher LDA vs 逻辑斯谛回归",
            text: "• <strong>感知器 (Perceptron)</strong>：只关心被分错的样本，谁分错了就把超平面往谁那边推一把（$a \\leftarrow a + \\rho y_i$），线性可分时有限步必停，不可分时死循环震荡。<br>• <strong>线性回归 (MSE 最小二乘)</strong>：强迫所有样本的输出值 $a^Ty_i$ 都等于目标常数 $b_i=1$，用矩阵求逆 $a=(Y^TY)^{-1}Y^Tb$ 一步算出。缺点是太老实，离分界线很远的正确样本也会把分界线拉偏！<br>• <strong>Fisher 线性判别 (LDA)</strong>：找一个最佳一维投影方向 $w^*=S_W^{-1}(\\mu_1-\\mu_2)$，让投影后<strong>同班同学抱得最紧（$S_W$最小），两个班中心离得最远（$S_B$最大）</strong>！<br>• <strong>逻辑斯谛回归 (Logistic Regression)</strong>：在线性函数 $w^Tx+b$ 外面套一层 S 形的 <strong>Sigmoid 函数 $\\sigma(z)=\\frac{1}{1+e^{-z}}$</strong>，直接把输出变成 $0\\sim 1$ 之间的后验概率，用<strong>交叉熵损失</strong>训练！"

                  <p>• <strong>感知器准则</strong>：$J_p(a) = \\sum_{y \\in Y^k} (-a^T y)$，迭代：$a(k+1) = a(k) + \\rho \\sum_{y \\in Y^k} y$。</p>

            content: `
              <pre class="bg-slate-900 text-emerald-300 p-4 rounded-xl text-xs overflow-x-auto leading-relaxed">// 1. 带头结点单链表原地逆置 (头插法，时间 O(n)，空间 O(1))
void ReverseList(LinkList L) {
    LNode *p = L->next, *q;
    L->next = NULL; // 摘下头结点置空
    while (p != NULL) {
        q = p->next;       // 暂存后继防断链
        p->next = L->next; // 头插法插入到 L 之后
        L->next = p;
        p = q;
    }
}

// 2. 双指针一次遍历查找单链表倒数第 k 个结点 (时间 O(n)，空间 O(1))
LNode* FindKthToTail(LinkList L, int k) {
    LNode *fast = L->next, *slow = L->next;
    for (int i = 0; i < k; i++) {
        if (fast == NULL) return NULL; // 链表长度不足 k
        fast = fast->next;
    }
    while (fast != NULL) {
        fast = fast->next;
        slow = slow->next;
    }
    return slow;
}</pre>

int GetDepth(BiTree T) {
    if (T == NULL) return 0;
    int l = GetDepth(T->lchild);
    int r = GetDepth(T->rchild);
    return (l > r ? l : r) + 1;
}

// 2. 先序递归计算二叉树带权路径长度 WPL (调用时 deep 传 0)
int CalcWPL(BiTree T, int deep) {
    if (T == NULL) return 0;
    if (T->lchild == NULL && T->rchild == NULL)
        return T->weight * deep; // 叶结点累加 权值*路径长
    return CalcWPL(T->lchild, deep + 1) + CalcWPL(T->rchild, deep + 1);
}

// 3. 并查集 Find (带路径压缩) 与 Union (按规模合并)
