      {

        title: "第1章：绪论与评估指标",

        tag: "第一章 · 全局视野",
        fullTitle: "模式识别绪论与性能评估体系",
        subtitle: "搞懂什么是特征向量、模式识别五步流水线，以及为什么准确率会骗人。",
        plainTalk: [
          {
            title: "🍉 什么是“模式”和“特征向量”？（挑西瓜/相亲比喻）",
            text: "计算机看不懂现实中的真西瓜，所以我们要把一个西瓜变成一串数字：比如 $x = [\\text{颜色深浅 } 0.8, \\text{ 根蒂弯曲度 } 0.2, \\text{ 敲声清脆度 } 0.9]^T$。这串数字就叫【特征向量】，有几个数字就是几维空间里的一个点。所谓【模式识别/分类】，就是在空间里画一条分界线，把“好瓜的点”和“坏瓜的点”分到两边！"
          },
          {
            title: "🎯 查准率 (Precision) vs 查全率 (Recall) 怎么死记不混？",
            text: "想象你是警察抓坏人（正类）：<br>• <strong>查准率 (Precision) = 宁缺毋滥</strong>：你抓回来的 10 个人里，有几个是真坏人？（不冤枉好人则查准率高）。<br>• <strong>查全率 (Recall) = 宁可错杀不可放过</strong>：全城一共潜伏了 10 个坏人，被你抓到了几个？（没有漏网之鱼则查全率高）。"
          },
          {
            title: "⚠️ 为什么“准确率 (Accuracy)”经常是个骗子指标？",
            text: "假设全校 1000 人里只有 1 个传染病人。一个庸医闭着眼说“全校都没病”，他的准确率高达 $999/1000 = 99.9\\%$！但唯一的病人被漏掉了（查全率为 0）。所以在类别极不平衡时，绝不能只看准确率，必须看 F1-Score 或 ROC/AUC！"
          }
        ],
        sections: [
          {
            heading: "📐 核心考点一：三大流派与标准五步流水线",
            content: `
              <div class="bg-indigo-600/10 dark:bg-indigo-950/60 border border-indigo-500/30 rounded-xl p-4 mb-4 text-xs">
                <strong class="text-indigo-700 dark:text-indigo-300">标准流水线：</strong>
                数据获取 ➔ 预处理（去噪/归一化） ➔ <strong>特征提取与选择（第6章降维）</strong> ➔ <strong>分类器/聚类设计（第2~5, 7章）</strong> ➔ 评估输出
              </div>
              <ul class="list-disc list-inside space-y-2 text-xs leading-relaxed">
                <li><strong>统计模式识别（本课程核心）</strong>：把样本变成向量空间中的点 $x \\in \\mathbb{R}^d$，用概率分布（第2~3章）或几何分界面（第4~5章）分类。</li>
                <li><strong>结构（句法）模式识别</strong>：把复杂物体拆成基础零件（基元）和拓扑关系，用文法或图匹配识别（如汉字笔划结构、分子式）。</li>
                <li><strong>监督学习 vs 非监督学习</strong>：有标准答案（类别标签 $\\omega_i$）教着学叫<strong>监督学习（分类）</strong>；没标签自己按远近抱团叫<strong>非监督学习（聚类）</strong>。</li>
              </ul>
            `
          },
          {
            heading: "📐 核心考点二：混淆矩阵、F1 与 ROC / AUC 曲线",
            content: `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border dark:border-slate-700 space-y-1.5">
                  <div class="font-bold text-indigo-600 dark:text-indigo-400">核心计算公式：</div>
                  <p>• 查准率：$P = \\frac{TP}{TP + FP}$</p>
                  <p>• 查全率（真正率 TPR）：$R = \\text{TPR} = \\frac{TP}{TP + FN}$</p>
                  <p>• 假正率（误报率 FPR）：$\\text{FPR} = \\frac{FP}{FP + TN}$</p>
                  <p>• 综合指标：$F_1 = \\frac{2PR}{P + R}$</p>
                </div>
                <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border dark:border-slate-700 space-y-1.5">
                  <div class="font-bold text-emerald-600 dark:text-emerald-400">ROC 与 留一法 (LOO)：</div>
                  <p>• <strong>ROC 曲线</strong>：横轴为 $\\text{FPR}$，纵轴为 $\\text{TPR}$。曲线越往左上角拱，分类器越好；曲线下面积 <strong>AUC $\\in [0.5, 1]$</strong> 越大越好。</p>
                  <p>• <strong>留一法交叉验证</strong>：$N$ 个样本每次留 1 个测试、$N-1$ 个训练，重复 $N$ 次取平均。结果确定无偏，但计算量极大。</p>
                </div>
              </div>
            `
          }
        ],
        exam: {
          q: "【期末简答真题】在罕见病筛查任务中（健康人占 99.9%，患者占 0.1%），某分类器准确率高达 99.9%，该分类器一定好吗？为什么？应该改用什么指标？",
          a: "1. 不一定好。因为存在严重的【类别不平衡问题】，若分类器将所有样本无脑判为健康人，准确率也是 99.9%，但对患者的查全率（Recall/TPR）为 0，完全失效。<br>2. 应改用：查准率 P、查全率 R、F1-Score、ROC 曲线与 AUC 面积，或使用引入代价矩阵的【最小风险贝叶斯决策】。"
        }
      },

      {
        id: "ch2",
        title: "第2章：贝叶斯决策理论",
        badge: "核心必考",
        tag: "第二章 · 统计识别理论天花板",
        fullTitle: "贝叶斯决策理论 (Bayesian Decision Theory)",
        subtitle: "如果老天爷告诉了我们所有数据的真实概率分布，怎么做出错误率最低或损失最小的判断？",
        plainTalk: [
          {
            title: "🤧 用“冬天听见人咳嗽猜感冒”秒懂：先验、似然、后验！",
            text: "你在街上听见一个人咳嗽（特征 $x$），想判断他是不是感冒了（类别 $\\omega_1$）：<br>• <strong>先验概率 $P(\\omega_1)$【老底经验】</strong>：不看他咳不咳嗽，冬天大街上本来就有 $10\\%$ 的人感冒。<br>• <strong>类条件概率密度 $p(x|\\omega_1)$【似然】</strong>：如果一个人真的感冒了，他出现咳嗽症状的概率有多大（比如 $80\\%$）。<br>• <strong>后验概率 $P(\\omega_1|x)$【最终结论】</strong>：结合“冬天本来容易感冒”+“他现在确实在咳嗽”，通过贝叶斯公式算出他真感冒的概率！<br>👉 <strong>最小错误率贝叶斯决策就是：算出来哪个病的后验概率最大，就拍板诊断为哪个病！</strong>"
          },
          {
            title: "💰 什么是“最小风险决策”？（医院算账思维）",
            text: "有时候光看谁概率大不行！比如一个病人有 $90\\%$ 概率是普通肺炎，$10\\%$ 概率是早期肺癌。<br>• 把肺癌漏诊当普通肺炎治，代价是出人命（损失 $\\lambda_{12} = 1000$）；<br>• 把普通肺炎当疑似肺癌做进一步活检，代价只是花点钱受点惊吓（损失 $\\lambda_{21} = 10$）。<br>算一下总风险：判为肺炎的风险 $= 10\\% \\times 1000 = 100$；判为疑似肺癌的风险 $= 90\\% \\times 10 = 9$。<strong>选风险最小的（9 < 100），所以哪怕肺癌概率只有 10%，也必须判为疑似肺癌！</strong>"
          },
          {
            title: "🏉 正态分布下三种协方差矩阵 $\\Sigma_i$ 的几何大白话",
            text: "高维高斯分布的数据团在空间里就像一个个球或橄榄球：<br>• <strong>情况 1 ($\\Sigma_i = \\sigma^2 I$)</strong>：两类数据是两个<strong>一样大的正圆球</strong>。分界线就是两球心连线的垂直平分线（谁离球心<strong>欧氏距离</strong>近就归谁）。<br>• <strong>情况 2 ($\\Sigma_i = \\Sigma$)</strong>：两类数据是两个<strong>胖瘦和倾斜方向完全一样的橄榄球</strong>。这时候普通直尺量不准，要用沿着橄榄球方向拉伸过的橡皮尺（<strong>马氏距离</strong>）量，分界线依然是一条直线！<br>• <strong>情况 3 ($\\Sigma_i$ 各不相同)</strong>：一个是圆球，一个是细长橄榄球。一条直线分不开了，分界线会弯曲成<strong>抛物线、椭圆或双曲线（二次分类器）</strong>！"
          }
        ],
        lab: "bayes",
        sections: [
          {
            heading: "📐 核心考点一：贝叶斯公式、最小错误率与最小风险似然比准则",
            content: `
              <div class="space-y-3 text-xs">
                <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border dark:border-slate-700 math-block">
                  <strong>1. 最小错误率准则：</strong> $P(\\omega_i|x) = \\frac{p(x|\\omega_i)P(\\omega_i)}{p(x)}$，分母 $p(x)$ 对所有类相同可略去，等价于取对数判别函数最大：
                  $$g_i(x) = \\ln p(x|\\omega_i) + \\ln P(\\omega_i)$$
                </div>
                <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border dark:border-slate-700 math-block">
                  <strong>2. 最小风险准则（含损失矩阵 $\\lambda_{ij}$）：</strong> 先算采取行动 $\\alpha_i$ 的条件风险 $R(\\alpha_i|x) = \\sum_{j=1}^c \\lambda_{ij} P(\\omega_j|x)$，选风险最小的类。对于两类问题，等价于<strong>似然比准则</strong>：
                  $$\\Lambda(x) = \\frac{p(x|\\omega_1)}{p(x|\\omega_2)} \\underset{\\omega_2}{\\overset{\\omega_1}{\\gtrless}} \\frac{\\lambda_{12} - \\lambda_{22}}{\\lambda_{21} - \\lambda_{11}} \\cdot \\frac{P(\\omega_2)}{P(\\omega_1)}$$
                </div>
              </div>
            `
          },
          {
            heading: "📐 核心考点二：多元正态分布下的判别函数展开（必背公式）",
            content: `
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border dark:border-slate-700 text-xs math-block mb-3">
                $$g_i(x) = -\\frac{1}{2}(x-\\mu_i)^T\\Sigma_i^{-1}(x-\\mu_i) - \\frac{1}{2}\\ln|\\Sigma_i| + \\ln P(\\omega_i)$$
              </div>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                <div class="p-3 rounded-xl border dark:border-slate-700 bg-indigo-50/20 dark:bg-indigo-950/30">
                  <div class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">1. $\\Sigma_i = \\sigma^2 I$ (同方差独立)</div>
                  <p>消去 $-\\frac{1}{2\\sigma^2}x^Tx$，得线性判别：$g_i(x) = \\frac{\\mu_i^T}{\\sigma^2}x - \\frac{\\|\\mu_i\\|^2}{2\\sigma^2} + \\ln P(\\omega_i)$。先验相等时为<strong>最小欧氏距离分类器</strong>。</p>
                </div>
                <div class="p-3 rounded-xl border dark:border-slate-700 bg-indigo-50/20 dark:bg-indigo-950/30">
                  <div class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">2. $\\Sigma_i = \\Sigma$ (协方差相同)</div>
                  <p>消去 $-\\frac{1}{2}x^T\\Sigma^{-1}x$，仍为线性：$g_i(x) = (\\Sigma^{-1}\\mu_i)^Tx + w_{i0}$。先验相等时为<strong>最小马氏距离分类器</strong>。</p>
                </div>
                <div class="p-3 rounded-xl border dark:border-slate-700 bg-indigo-50/20 dark:bg-indigo-950/30">
                  <div class="font-bold text-indigo-600 dark:text-indigo-400 mb-1">3. $\\Sigma_i$ 不等 (任意协方差)</div>
                  <p>二次项不可消去：$g_i(x) = x^TW_ix + w_i^Tx + w_{i0}$，其中 $W_i = -\\frac{1}{2}\\Sigma_i^{-1}$，决策面为<strong>超二次曲面</strong>。</p>
                </div>
              </div>
            `
          }
        ],
        exam: {
          q: "【期末计算真题】已知两类先验相等 $P(\\omega_1)=P(\\omega_2)=0.5$，一维正态分布 $p(x|\\omega_1)\\sim N(0,1), p(x|\\omega_2)\\sim N(2,1)$。若损失矩阵 $\\lambda_{11}=\\lambda_{22}=0, \\lambda_{12}=1, \\lambda_{21}=3$，求最小错误率边界与最小风险边界。",
          a: "(1) <strong>最小错误率边界</strong>：两类方差相等且先验相等，分界点即两均值中点 $x^* = \\frac{0+2}{2} = 1$。<br>(2) <strong>最小风险边界</strong>：代入似然比公式 $\\frac{p(x|\\omega_1)}{p(x|\\omega_2)} > \\frac{1-0}{3-0}\\frac{0.5}{0.5} = \\frac{1}{3}$。两边取 $\\ln$ 得 $-\\frac{x^2}{2} + \\frac{(x-2)^2}{2} > -\\ln 3 \\implies 2-2x > -\\ln 3 \\implies x^* = 1 + \\frac{1}{2}\\ln 3 \\approx 1.55$。<br><strong>大白话解释</strong>：因为把 $\\omega_1$ 错判为 $\\omega_2$ 的罚款($\\lambda_{21}=3$)更重，所以分界线往右($\\omega_2$方向)推了，扩大了 $\\omega_1$ 的安全地盘！"
        }
      },

      {
        id: "ch3",
        title: "第3章：概率密度函数的估计",
        badge: "承上启下",
        tag: "第三章 · 从样本猜概率分布",
        fullTitle: "概率密度函数的参数与非参数估计",
        subtitle: "第2章假设概率公式已知，但现实中只有一堆样本点，怎么把概率分布曲线估算出来？",
        plainTalk: [

    // ==================== 4. 五大交互式算法实验室引擎 ====================
    // (1) 贝叶斯双高斯实验室
    function gaussian(x, mu, sig) {
      return (1 / (Math.sqrt(2 * Math.PI) * sig)) * Math.exp(-0.5 * ((x - mu) / sig) ** 2);
    }
    function updateBayesPlot() {
      const canvas = document.getElementById('bayes-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      const pw1 = parseFloat(document.getElementById('slider-pw1').value), pw2 = 1 - pw1;
      const mu1 = -1.0, sig1 = 1.0;
      const mu2 = parseFloat(document.getElementById('slider-mu2').value);
      const sig2 = parseFloat(document.getElementById('slider-sig2').value);
      document.getElementById('val-pw1').innerText = pw1.toFixed(2);
      document.getElementById('val-mu2').innerText = mu2.toFixed(1);
      document.getElementById('val-sig2').innerText = sig2.toFixed(1);

      const xMin = -4.5, xMax = 6.0, yMax = 0.42;
      const toX = x => ((x - xMin) / (xMax - xMin)) * (W - 60) + 30;
      const toY = y => H - 30 - (y / yMax) * (H - 50);

      ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(30, H - 30); ctx.lineTo(W - 30, H - 30); ctx.stroke();
      const steps = 400, dx = (xMax - xMin) / steps;
      let totalErr = 0;

      ctx.fillStyle = 'rgba(245, 158, 11, 0.35)';
      ctx.beginPath(); ctx.moveTo(toX(xMin), toY(0));
      for (let i = 0; i <= steps; i++) {
        const x = xMin + i * dx;
        const mY = Math.min(pw1 * gaussian(x, mu1, sig1), pw2 * gaussian(x, mu2, sig2));
        totalErr += mY * dx; ctx.lineTo(toX(x), toY(mY));
      }
      ctx.lineTo(toX(xMax), toY(0)); ctx.closePath(); ctx.fill();

      [{fn: x => pw1 * gaussian(x, mu1, sig1), c: '#f43f5e'}, {fn: x => pw2 * gaussian(x, mu2, sig2), c: '#38bdf8'}].forEach(cv => {
        ctx.strokeStyle = cv.c; ctx.lineWidth = 2.5; ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const x = xMin + i * dx;
          if (i === 0) ctx.moveTo(toX(x), toY(cv.fn(x))); else ctx.lineTo(toX(x), toY(cv.fn(x)));
        }
        ctx.stroke();
      });

      for (let i = 1; i <= steps; i++) {
        const x1 = xMin + (i - 1) * dx, x2 = xMin + i * dx;
        const d1 = pw1 * gaussian(x1, mu1, sig1) - pw2 * gaussian(x1, mu2, sig2);
        const d2 = pw1 * gaussian(x2, mu1, sig1) - pw2 * gaussian(x2, mu2, sig2);
        if (d1 * d2 <= 0 && Math.abs(d1 - d2) > 1e-5) {
          const xc = (x1 + x2) / 2;
          if (pw1 * gaussian(xc, mu1, sig1) > 0.003) {
            const cx = toX(xc);
            ctx.strokeStyle = '#10b981'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(cx, 20); ctx.lineTo(cx, H - 30); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#10b981'; ctx.font = 'bold 11px sans-serif'; ctx.fillText(`x*=${xc.toFixed(2)}`, cx - 24, 15);
          }
        }
      }
      document.getElementById('val-pe').innerText = (totalErr * 100).toFixed(2) + '%';
    }

    // (2) K-NN 实验室
    let knnPts = [], knnTest = { x: 300, y: 150 };
    function initKNNData() {
      knnPts = [];
      for (let i = 0; i < 30; i++) {
        knnPts.push({ x: 170 + (Math.random() - 0.5) * 190, y: 150 + (Math.random() - 0.5) * 170, label: 1 });
        knnPts.push({ x: 410 + (Math.random() - 0.5) * 190, y: 160 + (Math.random() - 0.5) * 170, label: 2 });
      }
      const c = document.getElementById('knn-canvas');
      if (c) {
        c.onmousemove = e => {
          const r = c.getBoundingClientRect();
          knnTest = { x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height) };
          drawKNN();
        };
      }
      drawKNN();
    }
    function drawKNN() {
      const c = document.getElementById('knn-canvas');
      if (!c) return;
      const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
      const k = parseInt(document.getElementById('knn-k').value);
      const nb = knnPts.map(p => ({ ...p, d: Math.hypot(p.x - knnTest.x, p.y - knnTest.y) })).sort((a, b) => a.d - b.d).slice(0, k);
      const maxR = nb.length ? nb[nb.length - 1].d : 0;

      ctx.beginPath(); ctx.arc(knnTest.x, knnTest.y, maxR, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(99, 102, 241, 0.15)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);

      let v1 = 0, v2 = 0;
      nb.forEach(n => {
        if (n.label === 1) v1++; else v2++;
        ctx.beginPath(); ctx.moveTo(knnTest.x, knnTest.y); ctx.lineTo(n.x, n.y);
        ctx.strokeStyle = n.label === 1 ? 'rgba(244,63,94,0.6)' : 'rgba(56,189,248,0.6)'; ctx.lineWidth = 2; ctx.stroke();
      });
      knnPts.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = p.label === 1 ? '#f43f5e' : '#38bdf8'; ctx.fill();
      });
      const pred = v1 > v2 ? 1 : 2;
      ctx.beginPath(); ctx.arc(knnTest.x, knnTest.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = pred === 1 ? '#f43f5e' : '#38bdf8'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

      document.getElementById('knn-vote-1').innerText = v1;
      document.getElementById('knn-vote-2').innerText = v2;
      document.getElementById('knn-radius').innerText = Math.round(maxR) + ' px';
      document.getElementById('knn-result').innerText = pred === 1 ? '🔴 类别 ω₁' : '🔵 类别 ω₂';
    }

    // (3) 线性分类与 SVM 实验室
    let linPts = [], linClass = 1;
    function setLinearAddClass(c) {
      linClass = c;
      document.getElementById('btn-add-c1').className = c === 1 ? "py-2 rounded-lg font-bold bg-rose-600 text-white" : "py-2 rounded-lg font-bold bg-slate-700 text-slate-300";
      document.getElementById('btn-add-c2').className = c === -1 ? "py-2 rounded-lg font-bold bg-sky-600 text-white" : "py-2 rounded-lg font-bold bg-slate-700 text-slate-300";
    }
    function initLinearData() {
      linPts = [
        {x: 160, y: 90, c: 1}, {x: 210, y: 80, c: 1}, {x: 140, y: 160, c: 1}, {x: 230, y: 130, c: 1}, {x: 180, y: 190, c: 1},
        {x: 380, y: 140, c: -1}, {x: 430, y: 200, c: -1}, {x: 350, y: 230, c: -1}, {x: 450, y: 130, c: -1}, {x: 410, y: 250, c: -1}
      ];
      const c = document.getElementById('linear-canvas');
      if (c) {
        c.onclick = e => {
          const r = c.getBoundingClientRect();
          linPts.push({ x: (e.clientX - r.left) * (c.width / r.width), y: (e.clientY - r.top) * (c.height / r.height), c: linClass });
          drawLinearLab();
        };
      }
      drawLinearLab();
    }
    function drawLinearLab() {
      const c = document.getElementById('linear-canvas');
      if (!c) return;
      const ctx = c.getContext('2d'), W = c.width, H = c.height;
      ctx.clearRect(0, 0, W, H);
      const c1 = linPts.filter(p => p.c === 1), c2 = linPts.filter(p => p.c === -1);
      if (c1.length && c2.length) {
        const m1 = { x: c1.reduce((s,p)=>s+p.x,0)/c1.length, y: c1.reduce((s,p)=>s+p.y,0)/c1.length };
        const m2 = { x: c2.reduce((s,p)=>s+p.x,0)/c2.length, y: c2.reduce((s,p)=>s+p.y,0)/c2.length };
        let wx = m1.x - m2.x, wy = m1.y - m2.y, norm = Math.hypot(wx, wy) || 1;
        wx /= norm; wy /= norm;
        let minP1 = Infinity, sv1 = c1[0], maxP2 = -Infinity, sv2 = c2[0];
        c1.forEach(p => { const pr = p.x * wx + p.y * wy; if (pr < minP1) { minP1 = pr; sv1 = p; } });
        c2.forEach(p => { const pr = p.x * wx + p.y * wy; if (pr > maxP2) { maxP2 = pr; sv2 = p; } });
        const mid = (minP1 + maxP2) / 2;
        document.getElementById('linear-margin-val').innerText = Math.max(0, minP1 - maxP2).toFixed(1) + ' px';

        const drawL = (val, col, dash) => {
          ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash(dash ? [5, 5] : []);
          ctx.beginPath();
          if (Math.abs(wy) > 0.1) { ctx.moveTo(0, val / wy); ctx.lineTo(W, (val - W * wx) / wy); }
          else { ctx.moveTo(val / wx, 0); ctx.lineTo(val / wx, H); }
          ctx.stroke(); ctx.setLineDash([]);
        };
        drawL(mid, '#10b981', false); drawL(minP1, 'rgba(255,255,255,0.4)', true); drawL(maxP2, 'rgba(255,255,255,0.4)', true);
        [sv1, sv2].forEach(sv => { ctx.beginPath(); ctx.arc(sv.x, sv.y, 11, 0, Math.PI * 2); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5; ctx.stroke(); });
      }
      linPts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2); ctx.fillStyle = p.c === 1 ? '#f43f5e' : '#38bdf8'; ctx.fill(); });
    }

    // (4) PCA 降维投影实验室
    let pcaPts = [];
    function generatePCAData() {
      const deg = parseFloat(document.getElementById('pca-angle')?.value || 35);
      const sp = parseFloat(document.getElementById('pca-spread')?.value || 25);
      const rad = (deg * Math.PI) / 180, cosA = Math.cos(rad), sinA = Math.sin(rad);
      pcaPts = [];
      for (let i = 0; i < 42; i++) {
        const u = (Math.random() - 0.5) * 250, v = (Math.random() - 0.5) * sp * 2.4;
        pcaPts.push({ x: 300 + u * cosA - v * sinA, y: 150 + u * sinA + v * cosA });
      }
      drawPCALab();
    }
    function drawPCALab() {
      const c = document.getElementById('pca-canvas');
      if (!c || !pcaPts.length) return;
      const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
      const mx = pcaPts.reduce((s,p)=>s+p.x,0)/pcaPts.length, my = pcaPts.reduce((s,p)=>s+p.y,0)/pcaPts.length;
      let sxx = 0, syy = 0, sxy = 0;
      pcaPts.forEach(p => { sxx += (p.x - mx) ** 2; syy += (p.y - my) ** 2; sxy += (p.x - mx) * (p.y - my); });
      const tr = sxx + syy, det = sxx * syy - sxy * sxy, disc = Math.sqrt(Math.max(0, (tr / 2) ** 2 - det));
      const l1 = tr / 2 + disc, l2 = Math.max(0, tr / 2 - disc);
      let ux = sxy, uy = l1 - sxx, un = Math.hypot(ux, uy) || 1;
      ux /= un; uy /= un;

      document.getElementById('pca-v1').innerText = ((l1 / (l1 + l2)) * 100).toFixed(1) + '%';
      document.getElementById('pca-v2').innerText = ((l2 / (l1 + l2)) * 100).toFixed(1) + '%';

      // 画各点到第一主成分轴的正交投影线
      pcaPts.forEach(p => {
        const proj = (p.x - mx) * ux + (p.y - my) * uy;
        const px = mx + proj * ux, py = my + proj * uy;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(px, py); ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2); ctx.fillStyle = '#38bdf8'; ctx.fill();
      });

      // 画第一主成分轴 (绿) 与第二主成分轴 (紫)
      ctx.strokeStyle = '#10b981'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(mx - ux * 220, my - uy * 220); ctx.lineTo(mx + ux * 220, my + uy * 220); ctx.stroke();
      ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(mx + uy * 90, my - ux * 90); ctx.lineTo(mx - uy * 90, my + ux * 90); ctx.stroke(); ctx.setLineDash([]);
    }

    // (5) K-Means 动态聚类实验室
    const kmCols = ['#f43f5e', '#38bdf8', '#10b981', '#f59e0b', '#a855f7'];
    let kmPts = [], kmCents = [], kmIter = 0;
    function randomKMeansData() {
      kmPts = [];
      [{x: 150, y: 100}, {x: 430, y: 110}, {x: 290, y: 220}].forEach(c => {
        for (let i = 0; i < 22; i++) kmPts.push({ x: c.x + (Math.random() - 0.5) * 120, y: c.y + (Math.random() - 0.5) * 100, cluster: -1 });
      });
      const canvas = document.getElementById('kmeans-canvas');
      if (canvas) {
        canvas.onclick = e => {
          const r = canvas.getBoundingClientRect();
          kmPts.push({ x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height), cluster: -1 });
          drawKMeans();
        };
      }
      initKMeansCentroids();
    }
    function initKMeansCentroids() {
      const k = parseInt(document.getElementById('kmeans-k')?.value || 3);
      kmCents = [];
      for (let i = 0; i < k; i++) kmCents.push({ x: 90 + Math.random() * 420, y: 50 + Math.random() * 200 });
      kmPts.forEach(p => p.cluster = -1);
      kmIter = 0;
      document.getElementById('kmeans-iter').innerText = 0;
      document.getElementById('kmeans-sse').innerText = '0';
      document.getElementById('kmeans-status').innerText = '旗子已插好，请点单步迭代';
      drawKMeans();
    }
    function stepKMeans() {
      if (!kmPts.length) return;
      let changed = false, sse = 0;
      kmPts.forEach(p => {
        let minD = Infinity, best = 0;
        kmCents.forEach((c, i) => { const d = (p.x - c.x) ** 2 + (p.y - c.y) ** 2; if (d < minD) { minD = d; best = i; } });
        if (p.cluster !== best) changed = true;
        p.cluster = best; sse += minD;
      });
      kmCents.forEach((c, i) => {
        const sub = kmPts.filter(p => p.cluster === i);
        if (sub.length) { c.x = sub.reduce((s,p)=>s+p.x,0)/sub.length; c.y = sub.reduce((s,p)=>s+p.y,0)/sub.length; }
      });
      kmIter++;
      document.getElementById('kmeans-iter').innerText = kmIter;
      document.getElementById('kmeans-sse').innerText = (sse / 1000).toFixed(1) + 'k';
      document.getElementById('kmeans-status').innerText = changed ? '人群跑动集合中...' : '🎉 已收敛稳定！';
      drawKMeans();
    }
    function drawKMeans() {
      const c = document.getElementById('kmeans-canvas');
      if (!c) return;
      const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
      kmPts.forEach(p => {
        if (p.cluster !== -1 && kmCents[p.cluster]) {
          ctx.strokeStyle = kmCols[p.cluster] + '33'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(kmCents[p.cluster].x, kmCents[p.cluster].y); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = p.cluster === -1 ? '#94a3b8' : kmCols[p.cluster]; ctx.fill();
      });
      kmCents.forEach((c, i) => {
        ctx.beginPath(); ctx.arc(c.x, c.y, 9, 0, Math.PI * 2);
        ctx.fillStyle = kmCols[i]; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
      });
    }

    // 页面初始化
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      updateProgress();
      selectChapter('ch1');
    });
  </script>
